<!-- Html Elements for Search -->
<div id="search-container">
  <label for="search-input" class="sr-only">{{ include.search_label | default: "Search articles" }}</label>
  <input type="text" id="search-input" placeholder="{{ include.search_label | default: "Search" }}..." data-search-scope="{{ include.search_scope | default: "all" }}">
  <button type="submit" id="search-button" aria-label="Search">🔍</button>
  <div id="themes-container" class="themes-container" hidden>
    <h2 class="themes-title">Explore by Theme</h2>
    <div id="themes-list" class="themes-list"></div>
  </div>
  <div id="search-status"></div>
  <ul id="results-container"></ul>
</div>

<!-- Configuration -->
<script>
document.addEventListener('DOMContentLoaded', function() {
  const searchInput = document.getElementById('search-input');
  const searchButton = document.getElementById('search-button');
  const resultsContainer = document.getElementById('results-container');
  const searchStatus = document.getElementById('search-status');
  const themesContainer = document.getElementById('themes-container');
  const themesList = document.getElementById('themes-list');
  const searchScope = searchInput.dataset.searchScope || 'all';
  const singularItemLabel = searchScope === 'articles' ? 'article' : searchScope === 'notes' ? 'note' : 'post';
  const pluralItemLabel = searchScope === 'articles' ? 'articles' : searchScope === 'notes' ? 'notes' : 'posts';
  
  // API endpoint - automatically use production URL when deployed
  const isDevelopment = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
  const API_URL = isDevelopment 
    ? 'http://localhost:8080/api/v1/search' 
    : 'https://api.firasesbai.com/api/v1/search';
  const THEMES_URL = isDevelopment
    ? 'http://localhost:8080/api/v1/themes?limit=8&min_count=2&include_posts=true'
    : 'https://api.firasesbai.com/api/v1/themes?limit=8&min_count=2&include_posts=true';
  const THEMES_CACHE_KEY = `blog_themes_${searchScope}`;
  const THEMES_CACHE_TTL = 7 * 24 * 60 * 60 * 1000;
  
  let debounceTimer;

  function escapeHtml(value) {
    const div = document.createElement('div');
    div.textContent = value || '';
    return div.innerHTML;
  }

  function itemLabel(count) {
    return count === 1 ? singularItemLabel : pluralItemLabel;
  }

  function clearActiveTheme() {
    themesList.querySelectorAll('.theme-chip').forEach(chip => {
      chip.classList.remove('theme-chip-active');
    });
  }

  function isInScope(post) {
    if (searchScope === 'articles') {
      return !post.url.startsWith('/notes/');
    }

    if (searchScope === 'notes') {
      return post.url.startsWith('/notes/');
    }

    return true;
  }

  function scopeTheme(theme) {
    const posts = (theme.posts || []).filter(isInScope);
    if (posts.length === 0) {
      return null;
    }

    return {
      ...theme,
      count: posts.length,
      posts
    };
  }

  function renderThemePosts(theme) {
    clearActiveTheme();
    const activeChip = themesList.querySelector(`[data-theme-slug="${theme.slug}"]`);
    if (activeChip) {
      activeChip.classList.add('theme-chip-active');
    }

    searchInput.value = '';
    searchStatus.textContent = `Showing ${theme.count} ${itemLabel(theme.count)} for ${theme.label}`;
    searchStatus.style.color = '#666';

    resultsContainer.innerHTML = theme.posts.map(post => `
      <li class="search-result">
        <div>
          <a href="${post.url}">
            <h4>${escapeHtml(post.title || post.url)}</h4>
          </a>
        </div>
      </li>
    `).join('');
  }

  function renderThemes(themes) {
    themes = themes.map(scopeTheme).filter(Boolean);

    if (!themes || themes.length === 0) {
      return;
    }

    themesList.innerHTML = themes.map(theme => `
      <button type="button" class="theme-chip" data-theme-slug="${theme.slug}">
        ${escapeHtml(theme.label)}
      </button>
    `).join('');

    themesList.querySelectorAll('.theme-chip').forEach((chip, index) => {
      chip.addEventListener('click', () => renderThemePosts(themes[index]));
    });

    themesContainer.hidden = false;
  }

  async function loadThemes() {
    try {
      const cached = localStorage.getItem(THEMES_CACHE_KEY);
      if (cached) {
        const parsed = JSON.parse(cached);
        if (Date.now() - parsed.timestamp < THEMES_CACHE_TTL) {
          renderThemes(parsed.themes);
          return;
        }
      }
    } catch (error) {
      // Ignore cache failures; themes are an enhancement.
    }

    try {
      const response = await fetch(THEMES_URL);
      if (!response.ok) {
        throw new Error(`Themes failed: ${response.statusText}`);
      }

      const data = await response.json();
      const themes = data.themes.map(scopeTheme).filter(Boolean);
      renderThemes(themes);

      try {
        localStorage.setItem(THEMES_CACHE_KEY, JSON.stringify({
          themes,
          timestamp: Date.now()
        }));
      } catch (error) {
        // Ignore cache write failures.
      }
    } catch (error) {
      console.warn('Themes unavailable:', error);
    }
  }
  
  async function performSearch(query) {
    clearActiveTheme();
    // Clear previous results
    resultsContainer.innerHTML = '';
    
    // Validate query
    if (!query || query.trim().length < 2) {
      searchStatus.textContent = '';
      return;
    }
    
    // Show loading state
    searchStatus.textContent = 'Searching...';
    searchStatus.style.color = '#666';
    
    // Create abort controller for timeout (30s to handle cold starts)
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 30000);
    
    try {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          query: query.trim(),
          limit: 5
        }),
        signal: controller.signal
      });
      
      clearTimeout(timeoutId);
      
      if (!response.ok) {
        throw new Error(`Search failed: ${response.statusText}`);
      }
      
      const data = await response.json();
      const results = data.results.filter(isInScope);
      
      // Update status
      searchStatus.textContent = `Found ${results.length} ${itemLabel(results.length)} in ${data.processing_time_ms.toFixed(0)}ms`;
      searchStatus.style.color = '#28a745';
      
      // Display results
      if (results.length === 0) {
        resultsContainer.innerHTML = '<li class="empty-result">No results found</li>';
        return;
      }
      
      resultsContainer.innerHTML = results.map(result => `
        <li class="search-result">
          <div>
            <a href="${result.url}">
              <h4>${escapeHtml(result.title)}</h4>
            </a>
            <p>
              ${escapeHtml(result.description)}
            </p>
            <small>
              ${escapeHtml(result.category)} · ${new Date(result.date).toLocaleDateString()}
            </small>
          </div>
        </li>
      `).join('');
      
    } catch (error) {
      clearTimeout(timeoutId);
      console.error('Search error:', error);
      
      let errorMessage = 'Search is temporarily unavailable.';
      if (error.name === 'AbortError') {
        errorMessage = 'Search request timed out.';
      } else if (error.message.includes('Failed to fetch')) {
        errorMessage = 'Unable to connect to search service.';
      }
      
      searchStatus.innerHTML = `${errorMessage} Please <a href="/archive/" style="color: #dc3545; text-decoration: underline;">browse the archive</a> or try again later.`;
      searchStatus.style.color = '#dc3545';
      resultsContainer.innerHTML = '';
    }
  }
  
  // Search on input with debounce
  searchInput.addEventListener('input', function(e) {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
      performSearch(e.target.value);
    }, 300); // Wait 300ms after user stops typing
  });
  
  // Search on button click
  searchButton.addEventListener('click', function(e) {
    e.preventDefault();
    performSearch(searchInput.value);
  });
  
  // Search on Enter key
  searchInput.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      performSearch(searchInput.value);
    }
  });

  loadThemes();
});
</script>
